name: Android AArch64 APK artifact

on:
  workflow_dispatch:
  push:
    branches:
      - artifact/n64-autoload-android

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
    - name: Check out source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: temurin

    - name: Build AArch64 APK
      shell: bash
      run: |
        set -euo pipefail
        cd pkg/android/phoenix
        ./gradlew --no-daemon assembleAarch64Debug
        apk_path=build/outputs/apk/aarch64/debug/phoenix-aarch64-debug.apk
        test -f "$apk_path"
        mkdir -p "$GITHUB_WORKSPACE/artifact"
        cp "$apk_path" "$GITHUB_WORKSPACE/artifact/phoenix-aarch64-debug.apk"
        sha256sum "$GITHUB_WORKSPACE/artifact/phoenix-aarch64-debug.apk" \
          | tee "$GITHUB_WORKSPACE/artifact/SHA256SUMS.txt"
        {
          echo "source_commit=$(git log -1 --format=%H -- command.c)"
          echo "build_commit=$(git rev-parse HEAD)"
          echo "artifact=phoenix-aarch64-debug.apk"
          echo "abi=arm64-v8a"
        } | tee "$GITHUB_WORKSPACE/artifact/build-metadata.txt"
        file "$GITHUB_WORKSPACE/artifact/phoenix-aarch64-debug.apk" \
          | tee -a "$GITHUB_WORKSPACE/artifact/build-metadata.txt"
        cat "$GITHUB_WORKSPACE/artifact/SHA256SUMS.txt" >> "$GITHUB_STEP_SUMMARY"
        cat "$GITHUB_WORKSPACE/artifact/build-metadata.txt" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: retroarch-android-aarch64-${{ github.sha }}
        path: artifact
        if-no-files-found: error
